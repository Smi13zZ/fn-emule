name: build-fpk

# 在 GitHub 上直接打出 fnOS 安装包（一个包通吃 x86 + ARM）：
#   * 推 v* 标签            → 构建 + 上传 artifact + 发布到该标签的 Release
#   * 手动 workflow_dispatch → 只构建 + 上传 artifact
#
# 版本号以 src/emule/manifest 里的 version 为准。
# 必须在 Debian 12 容器里构建：内置的 aMule 二进制取自 bookworm，用更新的发行版
# 构建会带进更高的 glibc 依赖，fnOS 上跑不起来。
#
# 单包多架构做法：
#   * manifest 的 platform = all；
#   * 包里同时带 runtime/amd64 与 runtime/arm64 两套引擎（aMule + 依赖库），
#     面板启动时按 platform.machine() 自动选；
#   * amd64 运行时用 ldd 自检，arm64 用 tools/resolve_libs.py 静态解析 ELF 依赖，
#     所以一个 amd64 runner 就能产出两种架构都跑得起来的包。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-fpk-${{ github.ref }}
  cancel-in-progress: true

env:
  FNPACK_URL: https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64

# 容器任务里 run: 默认用的是 sh（dash），不支持 set -o pipefail，统一改用 bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: 准备基础工具
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils file python3

      - uses: actions/checkout@v4

      - name: 读取 manifest 元信息
        id: meta
        run: |
          set -euo pipefail
          field() { awk -F= -v k="$1" '{n=$1; gsub(/[ \t]/,"",n); if(n==k){v=$2; gsub(/[ \t]/,"",v); print v}}' src/emule/manifest; }
          ver="$(field version)"; app="$(field appname)"
          [ -n "$ver" ] || { echo "manifest 里没有 version"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" = "v$ver" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "版本 $app $ver"

      - name: 安装 fnpack
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/fnpack "$FNPACK_URL"
          chmod +x /tmp/fnpack
          mv /tmp/fnpack /usr/local/bin/fnpack
          fnpack build --help >/dev/null

      - name: 取全架构 aMule 运行时（amd64 + arm64）
        run: |
          set -euo pipefail
          bash tools/build_runtime_full.sh /tmp/emule-runtime
          mkdir -p /tmp/runtime-extract
          tar -xzf /tmp/emule-runtime/amule-runtime-full.tar.gz -C /tmp/runtime-extract
          du -sh /tmp/runtime-extract/amd64 /tmp/runtime-extract/arm64
          file /tmp/runtime-extract/amd64/usr/bin/amuled /tmp/runtime-extract/arm64/usr/bin/amuled

      - name: 语法闸门 + 结构闸门 + 准备打包目录
        run: |
          set -euo pipefail
          python3 -m py_compile $(find src/emule/app/server -name "*.py")
          # 结构闸门：语法合法但方法缩进跑偏（类上少方法）这类错误 py_compile 抓不到，
          # 打进去后要等真实请求打进来才报 AttributeError，必须在这里拦住。
          python3 tools/check_structure.py $(find src/emule/app/server -name "*.py")
          rm -rf /tmp/build && mkdir -p /tmp/build
          cp -a src/emule/. /tmp/build/
          find /tmp/build -name "__pycache__" -type d -prune -exec rm -rf {} +
          find /tmp/build -type f \( -name "*.pyc" -o -name "*.fpk" -o -name "*.orig" \) -delete
          sed -i "s/^platform.*/platform              = all/" /tmp/build/manifest
          rm -rf /tmp/build/app/runtime && mkdir -p /tmp/build/app/runtime
          cp -a /tmp/runtime-extract/amd64 /tmp/runtime-extract/arm64 /tmp/build/app/runtime/
          find /tmp/build -type d -exec chmod 755 {} +
          find /tmp/build -type f -exec chmod 644 {} +
          chmod 755 /tmp/build/cmd/* /tmp/build/app/ui/index.cgi
          chmod 755 /tmp/build/app/runtime/*/usr/bin/* /tmp/build/app/runtime/*/usr/lib/*/*.so*
          grep -E "^(appname|version|platform)" /tmp/build/manifest
          du -sh /tmp/build/app/runtime

      - name: 打包
        run: |
          set -euo pipefail
          cd /tmp/build
          fnpack build
          out="$GITHUB_WORKSPACE/${{ steps.meta.outputs.app }}-${{ steps.meta.outputs.version }}-fnos-all.fpk"
          mv "${{ steps.meta.outputs.app }}.fpk" "$out"
          ls -lh "$out"
          sha256sum "$out"

      - name: 校验包结构（含两套引擎的 ELF 架构）
        run: |
          set -euo pipefail
          python3 tools/verify_fpk.py "$GITHUB_WORKSPACE/${{ steps.meta.outputs.app }}-${{ steps.meta.outputs.version }}-fnos-all.fpk"

      - name: 生成发布说明
        if: steps.meta.outputs.publish == 'true'
        run: |
          set -euo pipefail
          ver="${{ steps.meta.outputs.version }}"
          awk -v v="$ver" '
            $0 ~ "^## "v"[ \t]*$" {flag=1; print "## eMule 电驴 "v; print ""; skip=1; next}
            flag && skip && $0 ~ /^[ \t]*$/ {skip=0; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > /tmp/release-body.md
          printf '\n### 安装\n\n1. 下载 `%s-%s-fnos-all.fpk`（一个包，x86_64 与 ARM 设备通用）\n2. 飞牛 fnOS → 应用中心 → 手动安装 → 选择该文件\n3. 已在旧版本的，可以直接在「设置 → 更新」里点一键更新\n' \
            "${{ steps.meta.outputs.app }}" "$ver" >> /tmp/release-body.md
          printf '\n> 包内同时带 amd64 与 arm64 两套引擎，面板启动时按设备 CPU 自动选择，装错架构不存在。\n' >> /tmp/release-body.md
          cat /tmp/release-body.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.app }}-${{ steps.meta.outputs.version }}-fnos-all
          path: ${{ github.workspace }}/*.fpk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: eMule 电驴 ${{ steps.meta.outputs.version }}
          body_path: /tmp/release-body.md
          files: ${{ github.workspace }}/*.fpk
          fail_on_unmatched_files: true
